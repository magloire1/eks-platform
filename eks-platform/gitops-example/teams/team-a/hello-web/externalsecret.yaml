# Secret value lives in AWS Secrets Manager under the name  <cluster>/<team>/<app>  (JSON object).
# Example:  aws secretsmanager create-secret --name platform/team-a/hello-web --secret-string '{"API_KEY":"..."}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: hello-web-secrets
  dataFrom:
    - extract:
        key: platform/team-a/hello-web
